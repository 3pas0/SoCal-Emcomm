name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update weather feed
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = "https://api.weather.gov/alerts/active?point=33.9792,-118.0328"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "SoCal-Emcomm",
                  "Accept": "application/geo+json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

              alerts = data.get("features", [])

              if alerts:
                  weather = []
                  for alert in alerts[:5]:
                      info = alert["properties"]
                      weather.append(
                          f"{info.get('event', 'Weather Alert')} - "
                          f"{info.get('severity', 'Unknown')}"
                      )
                      weather.append(info.get("headline", ""))
              else:
                  weather = ["No active NWS alerts for Whittier."]

          except Exception as error:
              weather = ["Weather feed unavailable: " + str(error)]

          updated = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          lines = [
              "SOCAL EMCOMM WIRE",
              "=================",
              "",
              "LOS ANGELES COUNTY EMERGENCY INFORMATION",
              "",
              "FIRE:",
              "Automated fire feed coming next.",
              "",
              "WEATHER:",
              *weather,
              "",
              "EARTHQUAKES:",
              "Automated earthquake feed coming next.",
              "",
              "UPDATED:",
              updated,
          ]

          with open("wire.txt", "w", encoding="utf-8") as file:
              file.write("\n".join(lines) + "\n")
          PY

      - name: Commit wire.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire.txt
          git diff --cached --quiet || git commit -m "Update SoCal EMCOMM wire"
          git push

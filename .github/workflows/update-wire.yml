name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: socal-emcomm-wire
  cancel-in-progress: false

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build SoCal EMCOMM Wire
        run: |
          python <<'PY'
          import time
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          FIRE_URL = "https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Incident_Locations_Last24h/FeatureServer/0/query"

          params = {
              "where": "POOState='US-CA' AND IncidentTypeCategory='WF' AND POOCounty='Los Angeles'",
              "outFields": "IncidentName,POOCity,POOCounty,IncidentSize,PercentContained,IncidentShortDescription",
              "returnGeometry": "false",
              "resultRecordCount": "25",
              "f": "json"
          }

          headers = {
              "User-Agent": "SoCal-EMCOMM-Wire/1.0"
          }

          fire_lines = []

          def get_fire_data():
              for attempt in range(3):
                  response = requests.get(
                      FIRE_URL,
                      params=params,
                      headers=headers,
                      timeout=30
                  )

                  if response.status_code == 429:
                      print("WFIGS rate limited. Waiting 65 seconds...")
                      time.sleep(65)
                      continue

                  response.raise_for_status()

                  data = response.json()

                  if "error" in data:
                      raise RuntimeError(str(data["error"]))

                  return data

              raise RuntimeError("WFIGS rate limit continued after 3 attempts.")

          try:
              data = get_fire_data()

              incidents = []

              for feature in data.get("features", []):
                  attributes = feature.get("attributes", {})
                  incidents.append(attributes)

              incidents.sort(
                  key=lambda fire: fire.get("IncidentSize") or 0,
                  reverse=True
              )

              if incidents:
                  fire_lines.append(
                      "ACTIVE / RECENT WILDFIRES - LOS ANGELES COUNTY"
                  )
                  fire_lines.append("")

                  for fire in incidents:
                      name = fire.get("IncidentName") or "Unnamed Fire"
                      city = fire.get("POOCity")
                      county = fire.get("POOCounty") or "Los Angeles"
                      acres = fire.get("IncidentSize")
                      containment = fire.get("PercentContained")
                      description = fire.get("IncidentShortDescription")

                      fire_lines.append(name.upper())

                      if city:
                          fire_lines.append("Area: " + str(city))

                      fire_lines.append("County: " + str(county))

                      if acres is not None:
                          try:
                              fire_lines.append(
                                  "Size: {:,.1f} acres".format(float(acres))
                              )
                          except Exception:
                              fire_lines.append(
                                  "Size: " + str(acres) + " acres"
                              )

                      if containment is not None:
                          fire_lines.append(
                              "Containment: " + str(containment) + "%"
                          )

                      if description:
                          fire_lines.append(
                              "Info: " + str(description)
                          )

                      fire_lines.append("")

              else:
                  fire_lines.append(
                      "No Los Angeles County wildfires listed in the last 24 hours."
                  )

          except Exception as error:
              fire_lines.append(
                  "Fire feed temporarily unavailable."
              )
              fire_lines.append(
                  "Error: " + str(error)
              )

          now = datetime.now(
              ZoneInfo("America/Los_Angeles")
          ).strftime("%Y-%m-%d %I:%M %p")

          output = []

          output.append("SOCAL EMCOMM WIRE")
          output.append("=================")
          output.append("")
          output.append("LOS ANGELES COUNTY EMERGENCY INFORMATION")
          output.append("")
          output.append("")
          output.append("FIRE:")
          output.extend(fire_lines)
          output.append("")
          output.append("SOURCE:")
          output.append("NIFC WFIGS Incident Locations - Last 24 Hours")
          output.append("")
          output.append("")
          output.append("WEATHER:")
          output.append("Automated weather feed coming next.")
          output.append("")
          output.append("")
          output.append("EARTHQUAKES:")
          output.append("Automated earthquake feed coming next.")
          output.append("")
          output.append("")
          output.append("UPDATED:")
          output.append(now + " PT")

          wire = "\n".join(output) + "\n"

          with open("wire.txt", "w", encoding="utf-8") as file:
              file.write(wire)

          print(wire)
          PY

      - name: Commit updated wire
        run: |
          cp wire.txt /tmp/wire.txt

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/wire.txt wire.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wire.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update emergency wire"
          git push origin HEAD:main

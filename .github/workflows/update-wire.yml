name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4

      - name: Update LA County fire feed
        run: |
          python <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          URL = "https://www.fire.ca.gov/incidents/"

          headers = {
              "User-Agent": "SoCal-EMCOMM-Wire/1.0"
          }

          try:
              response = requests.get(URL, headers=headers, timeout=30)
              response.raise_for_status()

              soup = BeautifulSoup(response.text, "html.parser")

              incidents = []

              for row in soup.find_all("tr"):
                  cells = row.find_all("td")

                  if len(cells) < 5:
                      continue

                  values = [
                      cell.get_text(" ", strip=True)
                      for cell in cells
                  ]

                  incident = values[0]
                  county = values[1]
                  started = values[2]
                  acres = values[3]
                  containment = values[4]

                  if "los angeles" in county.lower():
                      incidents.append({
                          "incident": incident,
                          "county": county,
                          "started": started,
                          "acres": acres,
                          "containment": containment
                      })

              if incidents:
                  fire_lines = [
                      "FIRE:",
                      "SOURCE: CAL FIRE",
                      ""
                  ]

                  for fire in incidents:
                      fire_lines.extend([
                          f"[ACTIVE] {fire['incident']}",
                          f"County: {fire['county']}",
                          f"Started: {fire['started']}",
                          f"Acres: {fire['acres']}",
                          f"Containment: {fire['containment']}",
                          ""
                      ])

              else:
                  fire_lines = [
                      "FIRE:",
                      "SOURCE: CAL FIRE",
                      "No active CAL FIRE incidents listed for Los Angeles County.",
                      ""
                  ]

          except Exception as e:
              fire_lines = [
                  "FIRE:",
                  "SOURCE: CAL FIRE",
                  "Fire feed temporarily unavailable.",
                  ""
              ]
              print("Fire feed error:", e)

          fire_section = "\n".join(fire_lines)

          try:
              with open("wire.txt", "r", encoding="utf-8") as f:
                  wire = f.read()
          except FileNotFoundError:
              wire = """SOCAL EMCOMM WIRE
          =================

          LOS ANGELES COUNTY EMERGENCY INFORMATION

          FIRE:
          No data.

          WEATHER:
          Automated weather feed coming next.

          EARTHQUAKES:
          Automated earthquake feed coming next.

          UPDATED:
          """

          pattern = r"FIRE:.*?(?=\nWEATHER:)"

          if re.search(pattern, wire, flags=re.DOTALL):
              wire = re.sub(
                  pattern,
                  fire_section + "\n",
                  wire,
                  flags=re.DOTALL
              )
          else:
              print("Could not locate FIRE section.")

          now = datetime.now(
              ZoneInfo("America/Los_Angeles")
          ).strftime("%Y-%m-%d %H:%M PT")

          wire = re.sub(
              r"UPDATED:.*",
              f"UPDATED:\n{now}",
              wire,
              flags=re.DOTALL
          )

          with open("wire.txt", "w", encoding="utf-8") as f:
              f.write(wire)

          print(wire)
          PY

           - name: Commit updated wire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wire.txt
          git commit -m "Update emergency wire" || exit 0

          git pull --rebase origin main
          git push origin main

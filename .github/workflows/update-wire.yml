name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: socal-emcomm-wire
  cancel-in-progress: false

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build SoCal EMCOMM Wire
        run: |
          python <<'PY'
          import time
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          FIRE_URL = (
              "https://services3.arcgis.com/"
              "T4QMspbfLg3qTGWY/arcgis/rest/services/"
              "WFIGS_Incident_Locations_Last24h/FeatureServer/0/query"
          )

          params = {
              "where": "POOState='US-CA' AND IncidentTypeCategory='WF' AND POOCounty='Los Angeles'",
              "outFields": "IncidentName,POOCity,POOCounty,IncidentSize,PercentContained,IncidentShortDescription",
              "returnGeometry": "false",
              "resultRecordCount": "25",
              "f": "json"
          }

          headers = {
              "User-Agent": "SoCal-EMCOMM-Wire/1.0"
          }

          fire_lines = []

          def fetch_fire_data():
              last_error = None

              for attempt in range(3):
                  try:
                      response = requests.get(
                          FIRE_URL,
                          params=params,
                          headers=headers,
                          timeout=30
                      )

                      if response.status_code == 429:
                          last_error = "WFIGS rate limit reached"
                          time.sleep(65)
                          continue

                      response.raise_for_status()

                      data = response.json()

                      if "error" in data:
                          raise RuntimeError(data["error"])

                      return data

                  except Exception as error:
                      last_error = str(error)

                      if attempt < 2:
                          time.sleep(15)

              raise RuntimeError(last_error)

          try:
              data = fetch_fire_data()

              incidents = [
                  feature.get("attributes", {})
                  for feature in data.get("features", [])
              ]

              incidents.sort(
                  key=lambda fire: fire.get("IncidentSize") or 0,
                  reverse=True
              )

              if incidents:
                  fire_lines.append(
                      "ACTIVE / RECENT WILDFIRES - LOS ANGELES COUNTY"
                  )
                  fire_lines.append("")

                  for fire in incidents:
                      name = fire.get("IncidentName") or "Unnamed"
                      city = fire.get("POOCity")
                      county = fire.get("POOCounty") or "Los Angeles"
                      acres = fire.get("IncidentSize")
                      containment = fire.get("PercentContained")
                      description = fire.get("IncidentShortDescription")

                      fire_lines.append(
                          f"{name.upper()} FIRE"
                      )

                      if city:
                          fire_lines.append(
                              f"Area: {city}"
                          )

                      fire_lines.append(
                          f"County: {county}"
                      )

                      if acres is not None:
                          try:
                              fire_lines.append(
                                  f"Size: {float(acres):,.1f} acres"
                              )
                          except Exception:
                              fire_lines.append(
                                  f"Size: {acres} acres"
                              )

                      if containment is not None:
                          fire_lines.append(
                              f"Containment: {containment}%"
                          )

                      if description:
                          fire_lines.append(
                              f"Info: {description}"
                          )

                      fire_lines.append("")

              else:
                  fire_lines.append(
                      "No Los Angeles County wildfires were listed "
                      "in the WFIGS Last 24 Hours feed."
                  )

          except Exception as error:
              fire_lines.append(
                  "Fire feed temporarily unavailable."
              )
              fire_lines.append(
                  f"Error: {error}"
              )

          now = datetime.now(
              ZoneInfo("America/Los_Angeles")
          ).strftime("%Y-%m-%d %I:%M %p")

          wire = f"""SOCAL EMCOMM WIRE
=================

LOS ANGELES COUNTY EMERGENCY INFORMATION


FIRE:
{chr(10).join(fire_lines)}

SOURCE:
NIFC WFIGS Incident Locations - Last 24 Hours


WEATHER:
Automated weather feed coming next.


EARTHQUAKES:
Automated earthquake feed coming next.


UPDATED:
{now} PT
"""

          with open(
              "wire.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(wire)

          print(wire)

          PY

      - name: Commit updated wire
        run: |
          cp wire.txt /tmp/wire.txt

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/wire.txt wire.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wire.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update emergency wire"
          git push origin HEAD:main

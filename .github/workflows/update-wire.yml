name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: socal-emcomm-wire
  cancel-in-progress: false

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build SoCal EMCOMM Wire
        run: |
          python <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo

          URL = "https://www.fire.ca.gov/incidents/"

          headers = {
              "User-Agent": "SoCal-Emcomm/1.0"
          }

          fire_lines = []

          try:
              response = requests.get(
                  URL,
                  headers=headers,
                  timeout=30
              )

              response.raise_for_status()

              soup = BeautifulSoup(response.text, "html.parser")

              tables = soup.find_all("table")

              incidents = []

              for table in tables:
                  rows = table.find_all("tr")

                  for row in rows:
                      cells = [
                          cell.get_text(" ", strip=True)
                          for cell in row.find_all(["td", "th"])
                      ]

                      if len(cells) < 2:
                          continue

                      row_text = " | ".join(cells)

                      if "Los Angeles" in row_text:
                          incidents.append(cells)

              if incidents:
                  fire_lines.append(
                      "ACTIVE CAL FIRE INCIDENTS - LOS ANGELES COUNTY"
                  )
                  fire_lines.append("")

                  for incident in incidents:
                      fire_lines.append(
                          " | ".join(incident)
                      )
                      fire_lines.append("")

              else:
                  fire_lines.append(
                      "No active CAL FIRE incidents listed for Los Angeles County."
                  )

          except Exception as error:
              fire_lines.append(
                  "Fire feed temporarily unavailable."
              )
              fire_lines.append(
                  f"Error: {error}"
              )

          now = datetime.now(
              ZoneInfo("America/Los_Angeles")
          ).strftime("%Y-%m-%d %I:%M %p")

          wire = f"""SOCAL EMCOMM WIRE
          =================

          LOS ANGELES COUNTY EMERGENCY INFORMATION


          FIRE:
          {chr(10).join(fire_lines)}

          SOURCE:
          CAL FIRE Active Incidents


          WEATHER:
          Automated weather feed coming next.


          EARTHQUAKES:
          Automated earthquake feed coming next.


          UPDATED:
          {now} PT
          """

          # Remove YAML/Python indentation from output
          wire = "\n".join(
              line.strip() if line.startswith("          ") else line
              for line in wire.splitlines()
          )

          with open(
              "wire.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(wire.strip() + "\n")

          print(wire)

          PY

      - name: Commit updated wire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wire.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update emergency wire"

          git pull --rebase origin main

          git push origin main

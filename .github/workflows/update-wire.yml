name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch NWS weather alerts
        run: |
          python3 << 'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          # Whittier, CA
          url = "https://api.weather.gov/alerts/active?point=33.9792,-118.0328"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "SoCal-Emcomm/1.0",
                  "Accept": "application/geo+json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)

              alerts = data.get("features", [])

              weather_lines = []

              if not alerts:
                  weather_lines.append("No active NWS alerts for Whittier.")
              else:
                  for alert in alerts[:5]:
                      p = alert.get("properties", {})
                      event = p.get("event", "Weather Alert")
                      severity = p.get("severity", "Unknown")
                      headline = p.get("headline", "")
                      area = p.get("areaDesc", "")

                      weather_lines.append(f"{event} [{severity}]")
                      if headline:
                          weather_lines.append(headline)
                      if area:
                          weather_lines.append(f"Area: {area}")
                      weather_lines.append("")

          except Exception as e:
              weather_lines = [f"NWS weather feed unavailable: {e}"]

          updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          output = """SOCAL EMCOMM WIRE
          =================

          LOS ANGELES COUNTY EMERGENCY INFORMATION

          FIRE:
          Automated fire feed coming next.

          WEATHER:
          """ + "\n".join(weather_lines) + """

          EARTHQUAKES:
          Automated earthquake feed coming next.

          UPDATED:
          """ + updated + "\n"

          # Remove YAML indentation from output
          output = "\n".join(line.strip() for line in output.splitlines())

          with open("wire.txt", "w", encoding="utf-8") as f:
              f.write(output)

          print(output)
          PY

      - name: Commit updated wire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire.txt
          git diff --cached --quiet || git commit -m "Update emergency wire"
          git push

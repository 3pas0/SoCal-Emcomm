name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: socal-emcomm-wire
  cancel-in-progress: false

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build SoCal EMCOMM Wire
        run: |
          python <<'PY'
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          FIRE_URL = (
              "https://services3.arcgis.com/"
              "T4QMspbfLg3qTGWY/arcgis/rest/services/"
              "WFIGS_Incident_Locations_Current/FeatureServer/0/query"
          )

          params = {
              "where": "POOState='US-CA' AND IncidentTypeCategory='WF'",
              "outFields": (
                  "IncidentName,"
                  "POOCounty,"
                  "IncidentSize,"
                  "PercentContained,"
                  "FireDiscoveryDateTime,"
                  "ModifiedOnDateTime_dt,"
                  "UniqueFireIdentifier"
              ),
              "returnGeometry": "false",
              "f": "json"
          }

          fire_lines = []

          try:
              response = requests.get(
                  FIRE_URL,
                  params=params,
                  timeout=30
              )

              response.raise_for_status()
              data = response.json()

              if "error" in data:
                  raise RuntimeError(data["error"])

              incidents = []

              for feature in data.get("features", []):
                  attributes = feature.get("attributes", {})

                  county = str(
                      attributes.get("POOCounty") or ""
                  )

                  if "Los Angeles" not in county:
                      continue

                  incidents.append(attributes)

              incidents.sort(
                  key=lambda x: x.get("IncidentSize") or 0,
                  reverse=True
              )

              if incidents:
                  fire_lines.append(
                      "ACTIVE WILDFIRES - LOS ANGELES COUNTY"
                  )
                  fire_lines.append("")

                  for fire in incidents[:10]:
                      name = (
                          fire.get("IncidentName")
                          or "Unnamed Fire"
                      )

                      acres = fire.get("IncidentSize")

                      containment = fire.get(
                          "PercentContained"
                      )

                      county = (
                          fire.get("POOCounty")
                          or "Los Angeles"
                      )

                      fire_lines.append(
                          f"{name.upper()} FIRE"
                      )

                      fire_lines.append(
                          f"County: {county}"
                      )

                      if acres is not None:
                          try:
                              fire_lines.append(
                                  f"Size: {float(acres):,.0f} acres"
                              )
                          except Exception:
                              fire_lines.append(
                                  f"Size: {acres} acres"
                              )

                      if containment is not None:
                          fire_lines.append(
                              f"Containment: {containment}%"
                          )

                      fire_lines.append("")

              else:
                  fire_lines.append(
                      "No active WFIGS wildfires currently listed "
                      "for Los Angeles County."
                  )

          except Exception as error:
              fire_lines.append(
                  "Fire feed temporarily unavailable."
              )

              fire_lines.append(
                  f"Error: {error}"
              )

          now = datetime.now(
              ZoneInfo("America/Los_Angeles")
          ).strftime("%Y-%m-%d %I:%M %p")

          wire = f"""SOCAL EMCOMM WIRE
          =================

          LOS ANGELES COUNTY EMERGENCY INFORMATION


          FIRE:
          {chr(10).join(fire_lines)}

          SOURCE:
          NIFC WFIGS Current Incident Locations


          WEATHER:
          Automated weather feed coming next.


          EARTHQUAKES:
          Automated earthquake feed coming next.


          UPDATED:
          {now} PT
          """

          wire = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in wire.splitlines()
          )

          with open(
              "wire.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  wire.strip() + "\n"
              )

          print(wire)

          PY

      - name: Commit updated wire
        run: |
          # Save the newly generated wire outside the repo
          cp wire.txt /tmp/wire.txt

          # Get the newest version of main
          git fetch origin main
          git reset --hard origin/main

          # Restore the newly generated wire
          cp /tmp/wire.txt wire.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wire.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update emergency wire"
          git push origin HEAD:main

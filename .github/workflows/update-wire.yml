name: Update SoCal EMCOMM Wire

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wire.txt
        run: |
          cat > wire.txt << 'EOF'
          SOCAL EMCOMM WIRE
          =================

          LOS ANGELES COUNTY EMERGENCY INFORMATION

          FIRE:
          Automated fire feed coming next.

          WEATHER:
          Automated weather feed coming next.

          EARTHQUAKES:
          Automated earthquake feed coming next.

          UPDATED:
          GitHub Actions automatic test
          EOF

      - name: Commit updated wire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire.txt
          git diff --cached --quiet || git commit -m "Update emergency wire"
          git push
